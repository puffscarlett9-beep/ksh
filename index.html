  <style>
    :root {
      --ink: #4a4037;
      --muted: #7b7168;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-strong: rgba(255, 255, 255, 0.92);
      --line: rgba(185, 179, 167, 0.58);
      --accent: #d88996;
      --shadow: 0 18px 50px rgba(74, 64, 55, 0.13);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      font-family: "SimHei", "黑体", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 48% 42%, rgba(255, 243, 199, 0.74) 0, rgba(255, 243, 199, 0.18) 18rem, transparent 34rem),
        radial-gradient(circle at top left, #fffdf7 0, #f6faff 48%, #f8f1ff 100%);
    }

    button,
    input,
    select {
      font: inherit;
      color: inherit;
    }

    button {
      border: 1px solid rgba(74, 64, 55, 0.12);
      background: var(--panel-strong);
      border-radius: 8px;
      min-height: 34px;
      padding: 0 12px;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(74, 64, 55, 0.06);
    }

    button:hover,
    button:focus-visible {
      border-color: rgba(216, 137, 150, 0.55);
      outline: none;
    }

    input,
    select {
      min-height: 34px;
      border: 1px solid rgba(74, 64, 55, 0.12);
      border-radius: 8px;
      padding: 0 10px;
      background: rgba(255, 255, 255, 0.86);
      min-width: 0;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 18px 12px;
      border-bottom: 1px solid rgba(185, 179, 167, 0.32);
      background: rgba(255, 255, 255, 0.52);
      backdrop-filter: blur(14px);
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.15;
      font-weight: 720;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(150px, 220px) auto auto auto auto;
      gap: 8px;
      align-items: center;
    }

    .stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .graph-meta {
      position: absolute;
      left: 18px;
      bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .pill {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(74, 64, 55, 0.10);
      box-shadow: 0 4px 18px rgba(74, 64, 55, 0.08);
      font-size: 12px;
      color: var(--muted);
    }

    #graph {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    #graph.dragging {
      cursor: grabbing;
    }

    .link {
      fill: none;
      stroke: #b9b3a7;
      stroke-width: 1.2;
      stroke-opacity: 0.72;
      transition: stroke-width 160ms ease, stroke-opacity 160ms ease;
    }

    .link.dimmed {
      stroke-opacity: 0.12;
    }

    .link.highlighted {
      stroke-width: 2.4;
      stroke-opacity: 0.95;
      stroke: #d88996;
    }

    .node-group {
      cursor: pointer;
      transition: opacity 160ms ease;
    }

    .node-group.dimmed {
      opacity: 0.18;
    }

    .node-group.hidden-label text {
      display: none;
    }

    .node {
      stroke: #fff;
      stroke-width: 1.5;
      filter: drop-shadow(0 7px 10px rgba(74, 64, 55, 0.16));
      transition: r 160ms ease, stroke-width 160ms ease, opacity 160ms ease;
    }

    .node-group:hover .node,
    .node-group.selected .node,
    .node-group.related .node {
      stroke: #d88996;
      stroke-width: 2.4;
    }

    .node-group.selected .node {
      filter: drop-shadow(0 0 16px rgba(216, 137, 150, 0.48));
    }

    .node-label {
      fill: #4a4037;
      paint-order: stroke;
      stroke: rgba(255, 255, 255, 0.86);
      stroke-width: 4px;
      stroke-linejoin: round;
      font-weight: 620;
      pointer-events: none;
    }

    .node-label.level-L4 {
      font-weight: 520;
      fill: #62574e;
    }

    .side {
      min-height: 0;
      overflow: auto;
      border-left: 1px solid rgba(185, 179, 167, 0.36);
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(16px);
      padding: 16px;
    }

    .section {
      padding: 14px 0;
      border-bottom: 1px solid rgba(185, 179, 167, 0.26);
    }

    .section:first-child {
      padding-top: 0;
    }

    .section:last-child {
      border-bottom: 0;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 760;
      line-height: 1.3;
    }

    .detail-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 760;
    }

    .detail-type {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .kv {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.55;
    }

    .kv b {
      color: var(--muted);
      font-weight: 620;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .tag {
      min-height: auto;
      box-shadow: none;
      border-radius: 999px;
      padding: 4px 9px;
      background: rgba(247, 233, 166, 0.72);
      border: 1px solid rgba(74, 64, 55, 0.09);
      font-size: 12px;
      line-height: 1.2;
    }

    .filters {
      display: grid;
      gap: 8px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }

    .bar-list {
      display: grid;
      gap: 7px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: minmax(86px, 1fr) minmax(80px, 1.4fr) 26px;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.3;
    }

    .bar-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #62574e;
    }

    .bar-track {
      height: 9px;
      border-radius: 999px;
      background: rgba(185, 179, 167, 0.18);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f7c9d4, #bfe3d0);
    }

    .heat-list {
      display: grid;
      gap: 7px;
      max-height: 220px;
      overflow: auto;
    }

    .heat-row {
      display: grid;
      grid-template-columns: minmax(80px, 1fr) repeat(3, 30px) 42px;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    .heat-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .heat-cell {
      min-height: 22px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: #4a4037;
      border: 1px solid rgba(74, 64, 55, 0.08);
      background: rgba(255, 255, 255, 0.62);
    }

    .roller {
      display: grid;
      gap: 9px;
    }

    .roller-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .dice-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
      align-items: center;
    }

    .die {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff7dc;
      border: 1px solid rgba(74, 64, 55, 0.13);
      font-weight: 760;
      box-shadow: 0 2px 8px rgba(74, 64, 55, 0.08);
    }

    .mini-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 6px;
      font-size: 12px;
      color: #62574e;
    }

    .mini-list button {
      width: 100%;
      min-height: 30px;
      padding: 0 9px;
      text-align: left;
      box-shadow: none;
      background: rgba(255, 255, 255, 0.72);
    }

    .legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      font-size: 12px;
      color: #62574e;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 999px;
      border: 1px solid rgba(74, 64, 55, 0.10);
      flex: 0 0 auto;
    }

    .tooltip {
      position: fixed;
      z-index: 20;
      max-width: min(320px, calc(100vw - 32px));
      padding: 9px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(74, 64, 55, 0.12);
      box-shadow: var(--shadow);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      opacity: 0;
      transform: translate(8px, 8px);
      transition: opacity 120ms ease;
      white-space: pre-line;
    }

    .tooltip.show {
      opacity: 1;
    }

    .round-end-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(56, 47, 40, 0.28);
      backdrop-filter: blur(5px);
    }

    .round-end-modal[hidden] {
      display: none !important;
    }

    .round-end-dialog {
      width: min(360px, calc(100vw - 40px));
      padding: 28px 26px 24px;
      border: 1px solid rgba(185, 179, 167, 0.28);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.98);
      box-shadow: 0 24px 70px rgba(74, 64, 55, 0.22);
      text-align: center;
    }

    .round-end-mark {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff0d3;
      color: #d8791e;
      font-size: 24px;
    }

    .round-end-dialog h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
    }

    .round-end-dialog p {
      margin: 10px 0 20px;
      color: #81766d;
      font-size: 14px;
      line-height: 1.65;
    }

    .round-end-dialog button {
      width: 100%;
      min-height: 42px;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100%;
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(560px, 72vh) auto;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: minmax(0, 1fr) repeat(2, auto);
      }

      .controls select {
        display: none;
      }

      }
    }

    @media (max-width: 560px) {

      .subtitle {
        white-space: normal;
      }

      .side {
        padding: 12px;
      }
    }

/* Cultural atlas presentation. All colors derive from the existing node palette. */
:root {
  --paper: #fffefb;
  --ink: #514c43;
  --hairline: #e9e1d5;
  --muted: #817d77;
  --gold: #d79937;
  --rose: #d88996;
  --left-width: 252px;
  --right-width: 302px;
}
* { letter-spacing: 0; scrollbar-width: thin; scrollbar-color: #ddd5c8 transparent; }
html, body { background: var(--paper); font-size: 14px; }
body::after { content: ""; position: fixed; inset: 10px; border: 1px solid #d7c8ac70; pointer-events: none; z-index: 10; }
button, input, select { transition: border-color 160ms, background-color 160ms, color 160ms; }
button { border-radius: 3px; box-shadow: none; }
button:hover { background: #fff5e3; border-color: #e4bf86; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }
button:disabled { cursor: wait; opacity: .6; }
::selection { background: #f7c9d4; }
.legacy-icon { display: none !important; }
.ui-icon { width: 17px; height: 17px; flex: 0 0 17px; display: inline-block; vertical-align: middle; }

.app {
  height: 100%; min-height: 0;
  grid-template-columns: var(--left-width) minmax(0, 1fr) var(--right-width);
  grid-template-rows: 120px minmax(0, 1fr);
  background: var(--paper);
}
.app.left-collapsed { grid-template-columns: 44px minmax(0, 1fr) var(--right-width); }

.app.left-collapsed.right-collapsed { grid-template-columns: 44px minmax(0, 1fr) 44px; }
.topbar {

}

.brand { gap: 16px; }

}

h1 { font-family: "STLiti", "华文隶书", "LiSu", "隶书", "Kaiti SC", "KaiTi", serif !important; font-size: 48px; font-weight: 400; line-height: 1; margin: 0; white-space: nowrap; }

.detail-placeholder::before { content: ""; width: 100%; max-width: 250px; aspect-ratio: 1.5; background: var(--ritual-art) center/contain no-repeat; opacity: .88; }
.detail-sheet { gap: 27px; }
.detail-heading { padding: 0 0 24px; border-bottom: 1px solid #e2d3ba; position: relative; }
.detail-heading::after { content: ""; width: 5px; height: 5px; background: #e4b98a; position: absolute; bottom: -3px; left: 0; transform: rotate(45deg); }
.detail-title { margin: 0 0 12px; font-family: "SimSun", "STSong", serif; font-size: 26px; line-height: 1.5; font-weight: 700; overflow-wrap: anywhere; }
.detail-kicker { color: #bf9759; font-size: 12px; }
.detail-block { gap: 10px; }
.detail-block h3 { display: flex; align-items: center; gap: 8px; color: #a18b6a; font-size: 11px; font-weight: 400; }
.detail-block h3::before { content: ""; width: 3px; height: 11px; background: #f0cf9d; }
.detail-block:nth-child(3) h3::before { background: #bfe3d0; }
.detail-block:nth-child(4) h3::before { background: #f7c9d4; }
.detail-block p { color: #59564f; font-size: 14px; line-height: 2; }
.game-shell { gap: 20px; }
.game-head { gap: 9px; padding-bottom: 19px; border-bottom: 1px solid #e5d6bd; }
.game-head strong { font-family: "SimSun", "STSong", serif; font-size: 23px; line-height: 1.5; }
.game-head span { color: #aa997f; font-size: 11px; line-height: 1.9; }
.game-setup label { color: #a18b6a; font-size: 11px; font-weight: 400; }
.game-setup input, .game-setup select { width: 100%; min-height: 38px; border-radius: 3px; border-color: #e4d6be; background: transparent; font-size: 12px; }
.game-actions .primary-action { display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 12px; min-height: 40px; }
#gameResetButton { width: 36px; min-width: 36px; min-height: 40px; padding: 0; background: none; border-color: #e4d6be; font-size: 0; display: grid; place-items: center; color: #a78f66; }
#gameResetButton::before { content: ""; width: 16px; height: 16px; background: currentColor; mask: var(--icon-RotateCcw) center/contain no-repeat; }
.game-dice { min-height: 110px; justify-content: center; padding: 20px 5px; border-top: 1px dashed #e8dbc6; border-bottom: 1px dashed #e8dbc6; background: #fffcf4; }
.game-die { width: 44px; background: #fffdf6; border-color: #e5cfaa; border-radius: 5px; box-shadow: 0 3px 0 #eee0c7; color: #ce8793; font-size: 34px; }
.game-result { padding: 15px; border-left-width: 2px; background: #fff5df; color: #807056; font-size: 12px; line-height: 1.9; }
.progress-chip { border-radius: 2px; font-size: 11px; color: #a89475; background: none; border-color: #e9ddc8; }
.game-note { color: #817d77; font-size: 11px; line-height: 1.8; }
.round-end-dialog { border-radius: 5px; border: 1px solid #e8d9bd; background: var(--paper); box-shadow: 0 15px 60px #463b2833; }

@media (min-width: 1001px) and (max-width: 1250px) {
  :root { --left-width: 228px; --right-width: 270px; }
  .topbar { padding-left: 28px; padding-right: 28px; }
  .filter-section, .left-panel .filter-section:first-of-type { padding-left: 23px; padding-right: 17px; }
  .left-actions { padding-left: 23px; padding-right: 17px; }
  .side .section { padding-left: 19px; padding-right: 24px; }
  .stage-toolbar { left: 15px; right: 15px; gap: 2px; }
  .stage-toolbar button { font-size: 10px; padding: 0 3px; gap: 4px; }
  .graph-meta { left: 16px; right: 16px; gap: 8px; }
  #hintLabel { flex-basis: 100%; margin-left: 0; }
  .tabs { padding-right: 20px; gap: 6px; }
  .tab { font-size: 11px; }
}
@media (max-width: 1000px) {
  html, body { height: auto; min-height: 100%; overflow: auto; }
  body::after { position: absolute; inset: 8px; }
  .app, .app.left-collapsed, .app.right-collapsed, .app.left-collapsed.right-collapsed { height: auto; min-height: 100vh; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 580px auto; }
  .topbar { grid-column: 1; grid-row: 1; height: 106px; padding: 20px 28px; }
  .top-stats > div:not(.music-control) { min-width: 73px; padding: 0 12px; }
  .music-control { padding-right: 15px; }
  .music-control input[type="range"] { width: 52px; }
  .left-panel { grid-column: 1; grid-row: 2; height: 231px; min-height: 0; max-height: none; overflow: hidden; border: 0; border-bottom: 1px solid #e6dccb; margin: 12px 20px 0; }
  .left-scroll { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 100%; padding: 0; overflow: auto; }
  .filter-section, .left-panel .filter-section:first-of-type { min-width: 0; padding: 15px 20px; }
  .filter-section:nth-child(2) .section-title { padding-right: 22px; }
  .left-actions { padding: 15px 20px; align-content: center; }
  .stage { grid-column: 1; grid-row: 3; }
  .stage-toolbar { flex-wrap: nowrap; left: 28px; right: 28px; }
  .side { grid-column: 1; grid-row: 4; border: 0; border-top: 1px solid #e6dccb; margin: 0 20px 20px; overflow: hidden; padding-top: 16px; }
  .tabs { padding-left: 40px; padding-right: 10px; height: 40px; }
  .tab { min-height: 40px; }
  .side .tab-pane.active { height: auto; overflow: visible; }
  .side .section { padding: 25px 20px; }
  .detail-sheet { max-width: 700px; margin: auto; }
  .game-shell { max-width: 550px; margin: auto; }
  .detail-placeholder { min-height: 290px; padding-top: 15px; gap: 20px; }
  .detail-placeholder::before { max-width: 220px; }
  .sidebar-toggle { top: 8px; }
  .left-toggle { left: auto; right: 8px; }
  .right-toggle { top: 16px; left: 3px; right: auto; }
  .app.left-collapsed .left-panel { height: 48px; min-height: 48px; }
  .app.right-collapsed .side { height: 48px; min-height: 48px; }
  .app.left-collapsed .left-toggle, .app.right-collapsed .right-toggle { left: 5px; top: 8px; }
}
@media (max-width: 600px) {
  .app, .app.left-collapsed, .app.right-collapsed, .app.left-collapsed.right-collapsed { grid-template-rows: auto auto 540px auto; }
  .topbar { height: auto; min-height: 152px; padding: 22px 24px 0; grid-template-columns: minmax(0, 1fr); gap: 15px; }
  .topbar::after { left: 20px; right: 20px; }
  .brand { gap: 12px; }
  .brand-mark { width: 37px; height: 37px; flex-basis: 37px; }
  .brand-mark .ui-icon { width: 34px; height: 34px; }
  h1 { font-size: 40px; }
  .subtitle { font-size: 10px; margin-top: 8px; }
  .top-stats { min-height: 53px; width: 100%; justify-content: space-between; }
  .top-stats > div:not(.music-control) { min-width: 52px; padding: 0 8px; }
  .top-stats strong { font-size: 22px; }
  .top-stats span { font-size: 11px; margin-top: 5px; }
  .music-control { padding-right: 5px; gap: 2px; }
  .music-control input[type="range"] { width: 42px; }
  .left-panel { height: 216px; margin-top: 12px; }
  .left-scroll { grid-template-columns: minmax(0, 1fr); }
  .filter-section, .left-panel .filter-section:first-of-type { padding: 13px 6px; }
  .filter-section { border-bottom: 1px solid #eee6d8; }
  .left-toggle { right: 1px; }
  #diceFilterButtons { gap: 9px; }
  #diceFilterButtons .filter-btn { height: 58px; font-size: 11px; }
  .filter-btn { font-size: 12px; min-height: 35px; }
  .chip-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  .chip-list .filter-btn { font-size: 11px; gap: 4px; }
  .left-actions { padding: 16px 6px; grid-template-columns: 1fr 1fr; }
  .stage-toolbar { top: 14px; left: 22px; right: 22px; gap: 3px; }
  .stage-toolbar button { font-size: 10px; padding: 0 3px; gap: 4px; }
  #zoomInButton, #zoomOutButton { width: 25px; min-width: 25px; }
  #graph { top: 49px; height: calc(100% - 112px); }
  .graph-meta { left: 25px; right: 25px; bottom: 19px; gap: 4px 15px; }
  #hintLabel { flex-basis: 100%; margin-left: 0; }
  .side .section { padding: 27px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  <script id="rule-details" type="application/json">[{"name":"福禄寿令","diceCount":1,"diceRequirement":"普通六面骰子，点数1-6，无特殊标记，适合日常酒桌。","tools":"无额外专用用具。","coreRule":"顺时针轮流摇骰。4为福，合席同饮且骰子归公；5为寿，摇骰者自饮一大杯；6为禄，摇骰者自留骰子；1-3点无效并传骰。无骰者需向持禄骰者买骰，累计6枚禄骰后令止。","cultureGroup":"吉祥礼俗"},{"name":"遇缺即升令","diceCount":1,"diceRequirement":"普通六面骰子，无特殊要求。","tools":"6只按1-6编号的空酒盏、1只酒壶。","coreRule":"轮流摇骰，摇出几点就往对应编号酒盏斟满酒。同一人先后摇出3、5点为“越级飞升”，加倍饮酒；摇出6点为“一品当朝”，本轮免摇并传骰；6只酒盏全满令止。","cultureGroup":"功名角色"},{"name":"状元游街令","diceCount":1,"diceRequirement":"普通六面骰子，点数需清晰便于众人查看。","tools":"5只小酒盏、1只大号“状元杯”、1只酒壶。","coreRule":"轮流摇骰，1-5点往对应序号小酒盏斟满且不重复；摇出4点为“状元”，饮尽状元杯后起身与全席猜拳通关。5只小杯酒全饮尽令止。","cultureGroup":"功名角色"},{"name":"一色令","diceCount":1,"diceRequirement":"普通六面骰子，适合多人快速互动。","tools":"无额外专用用具。","coreRule":"点数决定饮酒对象：1点上家饮1杯；2点下家饮1杯；3点与席间第三位客人猜三拳；4点自饮1杯；5点席间第五位饮1杯；6点与席间第六位猜六拳，人数不足时按规则顺延。","cultureGroup":"人情关系"},{"name":"六顺令","diceCount":1,"diceRequirement":"普通六面骰子，无特殊要求。","tools":"无额外专用用具。","coreRule":"每位参与者连摇六次，目标点数依次为1至6。摇中目标点数，自饮对应杯数；未摇中则按规则陪饮或敬饮。完成六次后传骰，宴席主人叫停令止。","cultureGroup":"竞技判定"},{"name":"探花令","diceCount":1,"diceRequirement":"普通六面骰子，点数清晰便于核对。","tools":"无额外专用用具。","coreRule":"先推令官，令官摇骰定“标准点”并公示。令官下家摇骰，点数与标准点相同则令官饮1杯；不同则下家自饮1杯，并成为新令官重新定标准点。","cultureGroup":"竞技判定"},{"name":"三星拱照令","diceCount":1,"diceRequirement":"普通六面骰子，操作简单。","tools":"无额外专用用具。","coreRule":"以3点为核心。摇出3点自饮1杯；4-6点时，上首分别有1、2、3人同饮；1-2点时，下首分别有2、1人同饮，人数不足由摇骰者补足。","cultureGroup":"人情关系"},{"name":"赏月令","diceCount":1,"diceRequirement":"普通六面骰子，适合中秋赏月宴席。","tools":"无额外专用用具。","coreRule":"以1为月。摇出1点，满席同饮“赏月酒”；未摇出1点，摇骰者自饮1杯，然后传骰循环。","cultureGroup":"节令意象"},{"name":"赏雪令","diceCount":1,"diceRequirement":"普通六面骰子，适合冬日赏雪宴席。","tools":"无额外专用用具。","coreRule":"以6为雪。摇出6点，满席同饮“赏雪酒”；未摇出6点，摇骰者自饮1杯，然后传骰循环。","cultureGroup":"节令意象"},{"name":"占风令","diceCount":2,"diceRequirement":"普通六面骰子，可搭配简易方位图。","tools":"无额外专用用具，可备方位图。","coreRule":"约定1为东、2为南、3为西、4为北，5、6重摇。令官摇骰定风向并盖定，客人轮流猜方位；猜中时对应方位者饮，猜错则猜者与令官同饮。","cultureGroup":"竞技判定"},{"name":"三多五福令","diceCount":2,"diceRequirement":"普通六面骰子，同时摇出并计算点数总和。","tools":"无额外专用用具。","coreRule":"3与5组合为8点时合席同饮；2与6、1与1、1与4组合免饮；其余点数和大于8时上首1人饮，小于8时下首1人饮，摇骰者均陪饮1杯。","cultureGroup":"吉祥礼俗"},{"name":"七子八婿令","diceCount":2,"diceRequirement":"普通六面骰子，摇出后计算点数总和。","tools":"无额外专用用具。","coreRule":"点数和为7时，摇骰者与席间多子者同饮；点数和为8时，摇骰者与席间多女者同饮；其余和大于8时上首1人饮，小于7时下首1人饮。","cultureGroup":"人情关系"},{"name":"五日延龄令","diceCount":2,"diceRequirement":"普通六面骰子，摇出后计算点数总和，适合端阳宴席。","tools":"无额外专用用具。","coreRule":"点数和为5时合席同饮；其余和大于5时上首1人饮，小于5时下首1人饮，摇骰者陪饮。","cultureGroup":"节令意象"},{"name":"七夕乞巧令","diceCount":2,"diceRequirement":"普通六面骰子，摇出后计算点数总和，适合七夕宴席。","tools":"无额外专用用具。","coreRule":"点数和为7时，摇骰者自饮；其余和大于7时上首1人饮，小于7时下首1人饮，摇骰者陪饮。","cultureGroup":"节令意象"},{"name":"赏花灯令","diceCount":2,"diceRequirement":"普通六面骰子，查看两个单点，无需计算总和。","tools":"无额外专用用具。","coreRule":"4为灯、5为花，同时出现4和5时合席同饮；1与4、1与5组合免饮；两骰均无4、5时，摇骰者自罚1杯。","cultureGroup":"节令意象"},{"name":"点将令","diceCount":2,"diceRequirement":"普通六面骰子，以单点4为核心。","tools":"无额外专用用具，可备将帅标识。","coreRule":"4为帅。参与者分两队，各队摇出4点者为帅；帅点将与对方猜拳，败者饮酒；所有将领出战后两帅对战，败队全体饮，败帅额外饮。","cultureGroup":"功名角色"},{"name":"猜点令","diceCount":2,"diceRequirement":"普通六面骰子，摇出后计算点数总和。","tools":"1只碗、若干酒盏。","coreRule":"令官摇骰并盖定点数和，客人轮流猜且不得重复。猜中则令官饮1巨杯，猜错则猜者自饮1杯；一轮结束后更换令官。","cultureGroup":"竞技判定"},{"name":"曹酒令","diceCount":2,"diceRequirement":"普通六面骰子，可用1枚或2枚，以单点1为核心。","tools":"1只酒海、若干酒盏。","coreRule":"摇出1点需买酒，每出现1枚一杯；无1点则免饮。全员完成一轮后，令官饮尽酒海中的剩余酒。","cultureGroup":"人情关系"},{"name":"锦团国令","diceCount":3,"diceRequirement":"普通六面骰子，需要查看点数组合与数量。","tools":"无额外专用用具。","coreRule":"对子加单数时重摇；有1点则摇骰者自饮1杯；出现对子则全席同饮；5点最多时右座饮，6点最多时对座饮；摇出4、5、6组合时合席巨饮并令止。","cultureGroup":"竞技判定"},{"name":"赶羊令","diceCount":3,"diceRequirement":"普通六面骰子，摇出后计算点数总和。","tools":"无额外专用用具。","coreRule":"令官先摇骰定“羊数”，客人轮流摇骰比大小。客人比羊数少几点就饮几杯；输家饮酒，赢家接骰继续。","cultureGroup":"竞技判定"},{"name":"三色令","diceCount":3,"diceRequirement":"可使用刻有人物、地点、事件图案或分色的特制骰子。","tools":"无额外专用用具。","coreRule":"按图案或颜色组合定采目：正采、本采免饮；杂采由摇骰者饮1杯；离奇组合由摇骰者饮双杯。","cultureGroup":"人情关系"},{"name":"连中三元令","diceCount":3,"diceRequirement":"普通六面骰子，以1点为核心。","tools":"无额外专用用具。","coreRule":"1为元。三骰均为1点即“连中三元”，席间应试者同饮；出现1至2个1点时摇骰者自饮1杯；没有1点时摇骰者自饮2杯。","cultureGroup":"功名角色"},{"name":"并头运令","diceCount":3,"diceRequirement":"普通六面骰子，以对子为核心。","tools":"无额外专用用具。","coreRule":"摇出对子为“并头”。席间有新婚者时，新婚夫妻同饮；无新婚者时，摇骰者自饮1杯。","cultureGroup":"人情关系"},{"name":"陈氏觞政图令","diceCount":3,"diceRequirement":"普通六面骰子，以4、5、6为核心点数。","tools":"无额外专用用具。","coreRule":"4为德、5为功、6为才，按三种点数出现的数量组合判定官职升降；升时全席贺饮，降时摇骰者罚饮。","cultureGroup":"功名角色"},{"name":"朱窝令（除红谱）","diceCount":4,"diceRequirement":"使用以红点为贵的四枚骰子。","tools":"无额外专用用具。","coreRule":"需恰好出现一枚红点骰；无红或两红及以上均重摇。满足条件后再按点数总和与组合判定饮罚，不同点数组合对应不同杯数。","cultureGroup":"竞技判定"},{"name":"事事如意令","diceCount":4,"diceRequirement":"普通六面骰子，以4点为核心。","tools":"无额外专用用具。","coreRule":"4为如意。累计每凑齐4个4点，摇骰者饮1杯；累计16个4点时饮双杯并令止。四枚骰子点数和为16点时称“四四如意”，全席同饮。","cultureGroup":"吉祥礼俗"},{"name":"公领孙令","diceCount":6,"diceRequirement":"普通六面骰子，以6点和1点为核心。","tools":"无额外专用用具。","coreRule":"6为公、1为孙，需先摇出6点再摇出1点。出现几个1点就有对应人数各饮1杯，孙数不少于3时饮双杯；无6点或有6无1点时，摇骰者罚饮1杯。","cultureGroup":"人情关系"},{"name":"长命富贵令","diceCount":6,"diceRequirement":"普通六面骰子，以4、5、6点为核心。","tools":"无额外专用用具。","coreRule":"4为贵、5为富、6为长命，三种点数全有时全席同饮；缺一种时可用其余点数凑补，重复点数送罚饮给上家；无法凑补则摇骰者自饮1杯。","cultureGroup":"吉祥礼俗"},{"name":"一路功名到白头令","diceCount":6,"diceRequirement":"普通六面骰子，以点数顺序为核心。","tools":"无额外专用用具。","coreRule":"轮流摇骰，累计按顺序摇出1至6即为功成名就；摇不出顺序、多摇无关点数或错摇顺序时，各罚饮1杯；凑齐完整顺序后令止。","cultureGroup":"功名角色"},{"name":"考试令（喜报登科）","diceCount":6,"diceRequirement":"6枚骰子配3枚牙牌，骰子用于拼点，牙牌用于定中式采。","tools":"3枚牙牌、若干酒盏。","coreRule":"令官用牙牌定中式采，参与者用6枚骰子拼21点。拼出的点数与中式采相符即为登科，摇骰者与报喜人对饮1杯。","cultureGroup":"功名角色"},{"name":"乌龙令（十二红）","diceCount":6,"diceRequirement":"使用以红点数量为判定依据的六枚骰子。","tools":"无额外专用用具。","coreRule":"轮流摇骰并计算红点。全黑无红为“乌龙”，不得再摇并需陪饮；猜拳输者与乌龙者同饮；累计集齐十二红后令止。","cultureGroup":"竞技判定"},{"name":"子孝双亲令","diceCount":6,"diceRequirement":"普通六面骰子，以点数总和为核心。","tools":"无额外专用用具。","coreRule":"点数和为26时全席同饮；大于26时上首1人饮，小于26时下首1人饮；小于24时摇骰者另自饮1杯。","cultureGroup":"吉祥礼俗"}]</script>

67-7-5 4.2 0 7 1.667 7 5Z\"></path></svg>","Expand":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m15 15 6 6\"></path><path d=\"m15 9 6-6\"></path><path d=\"M21 16v5h-5\"></path><path d=\"M21 8V3h-5\"></path><path d=\"M3 16v5h5\"></path><path d=\"m3 21 6-6\"></path><path d=\"M3 8V3h5\"></path><path d=\"M9 9 3 3\"></path></svg>","RotateCcw":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"></path><path d=\"M3 3v5h5\"></path></svg>","FoldVertical":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 22v-6\"></path><path d=\"M12 8V2\"></path><path d=\"M4 12H2\"></path><path d=\"M10 12H8\"></path><path d=\"M16 12h-2\"></path><path d=\"M22 12h-2\"></path><path d=\"m15 19-3-3-3 3\"></path><path d=\"m15 5-3 3-3-3\"></path></svg>","Scan":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 7V5a2 2 0 0 1 2-2h2\"></path><path d=\"M17 3h2a2 2 0 0 1 2 2v2\"></path><path d=\"M21 17v2a2 2 0 0 1-2 2h-2\"></path><path d=\"M7 21H5a2 2 0 0 1-2-2v-2\"></path></svg>","Plus":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"></path><path d=\"M12 5v14\"></path></svg>","Minus":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"></path></svg>","PanelLeftClose":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect><path d=\"M9 3v18\"></path><path d=\"m16 15-3-3 3-3\"></path></svg>","PanelLeftOpen":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect><path d=\"M9 3v18\"></path><path d=\"m14 9 3 3-3 3\"></path></svg>","PanelRightClose":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect><path d=\"M15 3v18\"></path><path d=\"m8 9 3 3-3 3\"></path></svg>","PanelRightOpen":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"></rect><path d=\"M15 3v18\"></path><path d=\"m10 15-3-3 3-3\"></path></svg>","Music2":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"18\" r=\"4\"></circle><path d=\"M12 18V2l7 4\"></path></svg>","AudioLines":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 10v3\"></path><path d=\"M6 6v11\"></path><path d=\"M10 3v18\"></path><path d=\"M14 8v7\"></path><path d=\"M18 5v13\"></path><path d=\"M22 10v3\"></path></svg>","ScrollText":"<svg class=\"ui-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 12h-5\"></path><path d=\"M15 8h-5\"></path><path d=\"M19 17V5a2 2 0 0 0-2-2H4\"></path><path d=\"M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3\"></path></svg>"};
      const motionPreference = window.matchMedia("(prefers-reduced-motion: reduce)");

      const appData = JSON.parse(document.getElementById("dataset").textContent);

      const ruleByName = new Map(ruleDetails.map(function (item) { return [item.name, item]; }));

      const linkLayer = document.getElementById("links");
      const nodeLayer = document.getElementById("nodes");
      const burstLayer = document.getElementById("bursts");
      const tooltip = document.getElementById("tooltip");
      const detailPanel = document.getElementById("detailPanel");
      const visibleCount = document.getElementById("visibleCount");
      const zoomLabel = document.getElementById("zoomLabel");
      const hintLabel = document.getElementById("hintLabel");
      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const expandButton = document.getElementById("expandButton");
      const fitButton = document.getElementById("fitButton");
      const resetButton = document.getElementById("resetButton");
      const clearFiltersButton = document.getElementById("clearFiltersButton");
      const zoomInButton = document.getElementById("zoomInButton");
      const zoomOutButton = document.getElementById("zoomOutButton");
      const dimensionFilter = document.getElementById("dimensionFilter");
      const difficultyFilter = document.getElementById("difficultyFilter");
      const mechanismFilter = document.getElementById("mechanismFilter");
      const diceFilterButtons = document.getElementById("diceFilterButtons");
      const mechanismButtons = document.getElementById("mechanismButtons");

      const dimensionButtons = document.getElementById("dimensionButtons");
      const gamePanel = document.getElementById("gamePanel");
